max_iterations: 50
checkpoint_interval: 5
log_level: INFO
random_seed: 42
diff_based_evolution: true
max_code_length: 20000
language: python
llm:
  api_base: http://localhost:8000/v1
  api_key: EMPTY
  models:
  - name: openai/gpt-oss-20b
    weight: 1.0
  temperature: 1.0
  max_tokens: 16384
  timeout: 1200
  retries: 2
prompt:
  system_message: |
    You are improving the serving policy of an LLM serving system that serves agent programs.
    
    THE WORKLOAD. A program is a multi-turn session: a model call, then a tool execution (a shell command, a web search, a code run) during which that program is idle while the engine serves others, then the next turn. Turn N+1's prompt CONTAINS turn N's prompt plus turn N's output plus the tool's result, so a program's context grows monotonically and later turns are the expensive ones. What is scored is job completion time per program: first arrival to last turn finishing, tool gaps included.
    
    THE ENGINE. Continuous batching, as in vLLM. Each step builds a batch under a token budget and a sequence limit; a long prompt is split across steps (chunked prefill). Running requests are served first, and a waiting turn is admitted only if its next chunk fits. When memory runs short the engine preempts by RECOMPUTE: the victim loses its whole KV cache and later re-prefills its prompt plus everything it had generated, so a preemption late in a long context is expensive. The default victim is the most recently admitted running request.
    
    THE MEMORY. One fixed pool, measured in tokens, shared by every program on the instance. It is allocated in blocks of 16 tokens; a prefix that matches part of a block is not a hit. The prefix cache is shared ACROSS programs, so a system prompt common to many of them is stored once and hits for all. A hit is a prefix: matching stops at the first token that differs. When a turn ends its blocks are not erased -- they stay cached and re-hittable until something else needs the space, at which point the least recently used unreferenced blocks are dropped. Protecting a program's context keeps those blocks out of that pool for everyone else until the protection expires.
    
    WHAT YOU CONTROL. You edit only the code between the EVOLVE-BLOCK markers. It holds one class per plane; edit, add or delete any of them.
      EvolvedRetention  — on_turn_complete(pcb, request_id, now) decides, as a turn ends and its gap begins: ("protect", deadline) holds the context until an absolute time, ("evict", None) drops it now, None leaves it in the ordinary LRU queue. on_turn_arrival(pcb, now) returns "release" to end a standing protection.
      EvolvedScheduling — priority(pcb, now) stamps queue order for a waiting turn, lower first. victim(candidates, now) picks which running request to preempt. admit(pcb, now, view) gates a waiting turn. Leave victim or admit undefined to keep the engine's rule.
      EvolvedRouting    — route(pcb, now) picks the instance a turn runs on. A turn routed away from where its context is cached must re-prefill it.
    A plane with no class falls back to the engine's own rule, which is a legal policy. The classes never see each other; where they interact they do it through the PCB, as a scheduler reading pcb.kv_protected, which the retention policy set.
    
    WHAT YOU OBSERVE. Only the Program Control Block passed in and the current time. You never see how long the current tool gap will last; predict it from turn index, tool name, context size, and what you have observed on earlier arrivals. Reading pcb.program_id or pcb.kv_request_id, keeping per-program tables, importing anything beyond math/statistics/collections/typing/dataclasses and the policy modules, and using the filesystem, clock, or randomness are rejected by a static check before simulation.
    
    THE TRADE. Protecting a long context across a short gap saves a re-prefill that would otherwise cost more than the memory. Protecting across a long gap, or under a tight budget, starves other programs and forces reclaims elsewhere. Tool names carry information about gap length. A deadline that is too short loses the protection exactly when it would have paid off; one that is too long holds memory nothing will use.
    
    FEEDBACK. Fitness is stock-JCT divided by candidate-JCT, averaged over cells that vary arrival rate and KV budget; 1.0 is parity with the stock LRU + FCFS configuration. Each evaluation returns the per-cell ratios and the counts of protect/evict/none/release decisions your policy made, so you can see whether a rule fired at all and where it helped.
    
    HOW TO WORK. Make one substantive change per attempt so the score attributes to it. Prefer decision rules whose inputs you can name over tuned constants: a rule that reads the tool's observed mean gap generalises to cells you have not been scored on, while a constant fitted to the cells you have seen does not.
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
database:
  population_size: 40
  archive_size: 20
  num_islands: 2
  elite_selection_ratio: 0.2
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  migration_interval: 10
  feature_dimensions:
  - protect_frac
  - evict_frac
  feature_bins: 5
evaluator:
  timeout: 5400
  max_retries: 1
  cascade_evaluation: true
  cascade_thresholds:
  - 0.95
  - 0.98
  parallel_evaluations: 4
  enable_artifacts: true
